{% extends "base.html" %}
{% block content %}
<div class="mb-4">
  <a href="/reports" class="text-blue-600 text-sm">&larr; Back</a>
</div>
<h2 class="text-xl font-bold mb-1">Report Cards — {{ stream.name }}</h2>
<p class="text-gray-600 text-sm mb-6">{{ term.name }}</p>

<div class="bg-white rounded-xl shadow overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-gray-100">
      <tr>
        <th class="px-3 py-2 text-left">Adm No</th>
        <th class="px-3 py-2 text-left">Name</th>
        <th class="px-3 py-2 text-left">Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for l in learners %}
      <tr class="border-t">
        <td class="px-3 py-2">{{ l.admission_no }}</td>
        <td class="px-3 py-2">{{ l.first_name }} {{ l.last_name }}</td>
        <td class="px-3 py-2 space-x-2">
          <a href="/reports/generate?learner_id={{ l.id }}&term_id={{ term.id }}"
             target="_blank"
             class="inline-block bg-blue-700 text-white text-xs px-3 py-1.5 rounded-lg">Print PDF</a>
          <a href="/comments/{{ l.id }}/{{ term.id }}"
             class="inline-block bg-gray-200 text-gray-800 text-xs px-3 py-1.5 rounded-lg">Comments</a>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="3" class="px-3 py-6 text-center text-gray-500">No learners in this stream</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
