<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{ school }} - Results</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
  <nav class="bg-blue-800 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="/" class="font-bold text-lg">{{ school }}</a>
      <div class="flex gap-3 text-sm">
        {% if user %}
          <span class="hidden sm:inline">{{ user.full_name }} ({{ user.role }})</span>
          <a href="/dashboard" class="hover:underline">Dashboard</a>
          <a href="/logout" class="hover:underline">Logout</a>
        {% else %}
          <a href="/login" class="hover:underline">Staff Login</a>
          <a href="/parent" class="hover:underline">Parent View</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-6 safe-bottom">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-xs text-gray-500 py-4">
    &copy; {{ school }} &bull; Results Management System
  </footer>
</body>
</html>
