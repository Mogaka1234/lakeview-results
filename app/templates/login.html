{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto mt-8">
  <h2 class="text-2xl font-bold text-center mb-6">Staff Login</h2>
  {% if error %}
  <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" class="bg-white p-6 rounded-xl shadow space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Username</label>
      <input type="text" name="username" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Password</label>
      <input type="password" name="password" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <button type="submit" class="w-full bg-blue-700 text-white py-3 rounded-lg font-semibold hover:bg-blue-800">Login</button>
  </form>
  <p class="text-center text-xs text-gray-500 mt-4">
    admin / Lakeview@Admin2026 &nbsp;|&nbsp; dos / Lakeview@DOS2026 &nbsp;|&nbsp; teacher1 / Lakeview@Teach2026
  </p>
</div>
{% endblock %}
