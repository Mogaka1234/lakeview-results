{% extends "base.html" %}
{% block content %}
<div class="text-center py-10">
  <h1 class="text-3xl font-bold text-blue-900 mb-2">{{ school }}</h1>
  <p class="text-gray-600 mb-2">Learner Results Management System<br>Grades 7 – 9</p>
  <p class="text-sm text-blue-700 font-medium mb-8">Official URL: results.lakeviewjunior.ac.ke</p>

  <div class="grid gap-4 max-w-md mx-auto">
    <a href="/parent" class="block bg-green-600 text-white rounded-xl py-4 px-6 text-lg font-semibold shadow hover:bg-green-700 transition">
      Parent / Learner View
      <div class="text-sm font-normal opacity-90">Enter view code to see results</div>
    </a>
    <a href="/login" class="block bg-blue-700 text-white rounded-xl py-4 px-6 text-lg font-semibold shadow hover:bg-blue-800 transition">
      Staff Login
      <div class="text-sm font-normal opacity-90">Teachers & Admin</div>
    </a>
  </div>
</div>
{% endblock %}
